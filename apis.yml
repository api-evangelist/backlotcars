aid: backlotcars
name: Backlotcars
description: >-
  BacklotCars, Inc. is a dealer-to-dealer wholesale used-vehicle marketplace,
  founded in Kansas City and acquired by KAR Global (now OPENLANE, Inc.), whose
  technology was consolidated into the OPENLANE US marketplace. It connects
  thousands of franchise and independent dealers through a 24/7 bid-ask
  marketplace, "Buy It Now" listings, and timed auctions scheduled throughout
  each week, backed by native mobile apps, in-lane vehicle inspections with
  AI-analyzed engine recordings, transportation, and floor-plan financing.
  Commercial sellers and dealer groups can push inventory straight from their
  own systems into OPENLANE Sell via OPENLANE Connect, a lightweight dealer
  integration API with a dedicated test environment. This profile began as a
  500 Global portfolio lead surfaced into the API Evangelist network and was
  enriched from OPENLANE's public marketing and product surface; the platform
  publishes no public OpenAPI or open developer portal.
